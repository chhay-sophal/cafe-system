name: Release POS Desktop

on:
  push:
    tags:
      - 'pos-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version with tag
        if: startsWith(github.ref, 'refs/tags/pos-v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#pos-v}"
          jq --arg v "$VERSION" '.version = $v' apps/pos/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json apps/pos/src-tauri/tauri.conf.json

      - name: Build and release POS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/pos
          tagName: ${{ github.ref_name }}
          releaseName: 'Cafe POS ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
